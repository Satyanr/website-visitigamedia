name: Cloudflare Pages (manual build and optional deploy)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'HTTPS canonical origin for this Cloudflare release (no path)'
        required: true
        type: string
      deploy:
        description: 'Explicitly deploy the validated build to Cloudflare production'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SITE_URL: ${{ inputs.site_url }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_VERSION: ${{ github.sha }}
      SEO_REQUIRE_NEWS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate public frontend configuration
        run: |
          node --input-type=module <<'NODE'
          import { assertBuildEnvironment } from './scripts/qwords-lib.mjs';
          assertBuildEnvironment(process.env);
          NODE
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build && npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: ${{ inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: dist/
      - name: Deploy explicitly approved Cloudflare release
        run: npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'visitiga-media' }}
